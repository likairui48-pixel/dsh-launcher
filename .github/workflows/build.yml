name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Show artifact
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish release (direct download, no login needed)
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="build-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            app/build/outputs/apk/debug/*.apk \
            --title "DSH Launcher $TAG" \
            --notes "由 GitHub Actions 自动构建的 debug 版 APK，可直接侧载安装。"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
