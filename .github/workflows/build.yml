name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

# 同一个分支只保留最新一次构建，避免连续提交炸出一堆并发任务
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 注意：不用 android-actions/setup-android。
      # GitHub 托管的 ubuntu runner 已经预装 Android SDK 并设好了 ANDROID_HOME/ANDROID_SDK_ROOT，
      # 额外装一次反而会因下载 cmdline-tools 失败而中断构建。

      # 先跑静态自检：XML / 资源引用 / style 继承链 / R.* / manifest / 脚本协议。
      # 它挡掉的正是「Gradle 报一堆资源错、要翻半天日志」的那类问题。
      - name: Static check
        run: node tools/static-check.js .

      - name: Compile debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Show artifact
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish release (direct download, no login needed)
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="build-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            app/build/outputs/apk/debug/*.apk \
            --title "DSH Launcher $TAG" \
            --notes "由 GitHub Actions 自动构建的 debug 版 APK，可直接侧载安装。"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
